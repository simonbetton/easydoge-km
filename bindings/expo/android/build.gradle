plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

def packageJson = new groovy.json.JsonSlurper().parse(new File(projectDir, '../package.json'))

group = 'io.easydoge'
version = packageJson.version

android {
  namespace 'io.easydoge.km.expo'

  defaultConfig {
    versionCode 1
    versionName packageJson.version
    consumerProguardFiles 'proguard-rules.pro'
  }

  // vendor/ is assembled by scripts/prepare-expo-package.sh: the Kotlin facade
  // and generated UniFFI sources plus the Rust libraries for every ABI.
  sourceSets {
    main {
      java.srcDirs += ['vendor/java']
      jniLibs.srcDirs += ['vendor/jniLibs']
    }
  }
}

dependencies {
  implementation 'net.java.dev.jna:jna:5.19.1@aar'
  implementation 'androidx.biometric:biometric:1.1.0'
}
