[workspace]
members = [
    "crates/easydoge-km",
    "crates/easydoge-km-cli",
    "crates/easydoge-km-ffi"
]
resolver = "2"

[workspace.package]
authors = ["EasyDoge Maintainers"]
edition = "2021"
homepage = "https://github.com/simonbetton/easydoge-km"
license = "MIT"
repository = "https://github.com/simonbetton/easydoge-km"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bip39 = { version = "2.2.2", features = ["all-languages", "rand", "zeroize"] }
bitcoin = { version = "0.32.7-doge.0", package = "bitcoin-dogecoin", features = ["serde", "rand-std"] }
bs58 = { version = "0.5", features = ["check"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29"
hex = "0.4"
ratatui = "0.30.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
unicode-normalization = "0.1"
uniffi = "0.32.0"
zeroize = { version = "1", features = ["derive"] }
